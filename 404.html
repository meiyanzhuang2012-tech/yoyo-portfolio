<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 · 页面不存在 | 祥顺智能</title>
<style>
:root{--bg:#0b0d12;--txt:#eef1f6;--dim:#98a1b3;--acc:#6ea8fe;--acc2:#7ef0c9}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:radial-gradient(900px 500px at 50% -10%, rgba(110,168,254,.18), transparent 60%),var(--bg);
  color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.65}
.code{font-size:clamp(64px,14vw,120px);font-weight:800;letter-spacing:-2px;
  background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(20px,3vw,28px);margin:10px 0 12px}
p{color:var(--dim);max-width:420px;margin:0 auto 28px}
a{display:inline-block;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:600;
  background:linear-gradient(135deg,var(--acc),#4f8ff0);color:#06101f}
a:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(110,168,254,.3)}
</style>
</head>
<body>
<div>
  <div class="code">404</div>
  <h1>这页还没做，或者被搬走了</h1>
  <p>你要找的页面不存在。回首页看看作品和团队介绍。</p>
  <a href="/yoyo-portfolio/">← 回首页</a>
</div>
</body>
</html>
