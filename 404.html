<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 祥顺智能</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0b0d12;--txt:#eef1f6;--dim:#98a1b3;--acc:#6ea8fe;--acc2:#7ef0c9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;
    background:radial-gradient(1200px 600px at 80% -10%,rgba(110,168,254,.18),transparent 60%),
               radial-gradient(900px 500px at 0% 20%,rgba(126,240,201,.10),transparent 55%),var(--bg);
    color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  .code{
    font-size:clamp(64px,14vw,112px);font-weight:800;letter-spacing:-.03em;line-height:1;
    background:linear-gradient(135deg,var(--acc),var(--acc2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  h1{font-size:19px;font-weight:650;margin:18px 0 10px}
  p{color:var(--dim);font-size:14px;margin-bottom:28px}
  a{
    display:inline-block;padding:12px 26px;border-radius:10px;font-size:14px;font-weight:600;
    background:linear-gradient(135deg,var(--acc),#5b8fe0);color:#08111f;text-decoration:none;transition:.2s;
  }
  a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能已失效，或地址被改动过。</p>
    <a href="/yoyo-portfolio/">回到作品集首页</a>
  </div>
</body>
</html>
